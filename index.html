<html lang="ko">
<head>

<title>자문의견 요청서 · 언론의 인공지능 활용에 대한 연구</title>
<style>
:root {
  --ink: #1d2433; --muted: #6b7280; --line: #d9dee7; --bg: #f4f6f9; --card: #fff;
  --brand: #0e5a8a; --brand-2: #1c8ac0; --ok: #1b7f3b; --danger: #b42318; --soft: #f1f4f8;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink);
  font-family: "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; font-size: 15px; line-height: 1.6; }
.topbar { display: flex; align-items: center; gap: .7rem; padding: .6rem 1.2rem; background: #fff; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; }
.topbar img { height: 30px; } .topbar span { font-weight: 700; }
.container { max-width: 860px; margin: 1.4rem auto 7rem; padding: 0 1rem; }
h1, h2, h3 { margin: .2em 0 .5em; line-height: 1.35; }
.hero { text-align: center; padding: 1.4rem 0 1rem; } .hero h1 { font-size: 1.7rem; margin: 0; } .hero p { margin: .3rem 0 0; color: var(--muted); font-size: 1.05rem; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 1.2rem 1.4rem; margin-bottom: 1.2rem; }
.card > h2 { font-size: 1.15rem; color: var(--brand); padding-bottom: .5rem; border-bottom: 2px solid var(--brand); margin-bottom: 1rem; }
.meta { display: grid; grid-template-columns: 7em 1fr; gap: .3rem 1rem; margin: 0 0 1rem; } .meta dt { font-weight: 700; } .meta dd { margin: 0; }
.intro { margin: 0; padding: 0; list-style: none; } .intro li { display: grid; grid-template-columns: 5.2em 1fr; gap: 1rem; padding: .35rem 0; }
.intro b { color: var(--brand); } .intro li.plain { display: block; text-align: center; font-weight: 600; padding-top: .8rem; }
.alert { padding: .7rem 1rem; border-radius: 8px; background: #eef3f8; border: 1px solid #cfe0ee; margin-bottom: 1.2rem; font-size: .95em; }
.alert.ok { background: #e9f7ee; border-color: #b9e3c6; } .alert[hidden] { display: none; }
.field { margin-bottom: 1.1rem; } .field:last-child { margin-bottom: 0; }
.field > label, .field > .label { display: block; font-weight: 700; font-size: .95em; margin-bottom: .3rem; }
.label small, label small { font-weight: 400; color: var(--muted); }
.req { color: #c62828; }
input[type=text], input[type=tel], input[type=number], input[type=date], textarea {
  width: 100%; padding: .5rem .65rem; border: 1px solid var(--line); border-radius: 6px; font: inherit; background: #fff; color: var(--ink); }
textarea { resize: vertical; min-height: 9.5em; line-height: 1.65; display: block; }
input:focus, textarea:focus { outline: 2px solid #bcd9ee; border-color: var(--brand-2); }
input.bad { border-color: var(--danger); outline: 2px solid #f4bcbc; }
.career { display: flex; align-items: center; gap: .5rem; } .career input { width: 5.5em; }
.options { display: flex; flex-wrap: wrap; gap: .4rem .6rem; }
.options label { display: inline-flex; align-items: center; gap: .4rem; padding: .35rem .8rem; border: 1px solid var(--line); border-radius: 999px; cursor: pointer; background: #fff; }
.options label:has(input:checked) { border-color: var(--brand); background: #e8f1f8; font-weight: 600; }
.options input { accent-color: var(--brand); margin: 0; }
.sub { font-weight: 700; background: var(--soft); border-left: 4px solid var(--brand); padding: .45rem .8rem; border-radius: 4px; margin: 1.6rem 0 1rem; }
.note { color: var(--muted); font-size: .92em; margin: 0 0 1rem; }
.q { margin-bottom: 1.8rem; } .q:last-child { margin-bottom: .2rem; }
.q h3 { font-size: 1.02rem; margin-bottom: .35rem; } .q .guide { color: #4b5563; font-size: .93em; margin: 0 0 .6rem; }
.q .count { text-align: right; color: var(--muted); font-size: .82em; margin-top: .2rem; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 1.2rem; }
.receipt-head { text-align: center; margin-bottom: 1.2rem; } .receipt-head .amount { font-size: 1.25rem; font-weight: 700; margin: .2rem 0 .5rem; } .receipt-head p { margin: 0; color: #4b5563; }
.receipt-to { text-align: center; font-weight: 700; margin: 1rem 0 .4rem; }
.closing { text-align: center; font-weight: 600; margin: 1.6rem 0; }
.btn { display: inline-block; padding: .55rem 1rem; border: 1px solid var(--line); border-radius: 7px; background: #fff; color: var(--ink); font: inherit; font-weight: 600; cursor: pointer; line-height: 1.3; white-space: nowrap; }
.btn:hover { background: var(--soft); } .btn:disabled { opacity: .5; cursor: default; }
.btn-primary { background: var(--brand); border-color: var(--brand); color: #fff; padding: .7rem 1.4rem; } .btn-primary:hover { background: #0b4a72; }
.actionbar { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid var(--line); box-shadow: 0 -4px 14px rgba(29,36,51,.06); z-index: 30; }
.actionbar .inner { max-width: 860px; margin: 0 auto; padding: .65rem 1rem; display: flex; align-items: center; gap: .8rem; flex-wrap: wrap; }
.status { flex: 1; min-width: 9em; color: var(--muted); font-size: .88em; line-height: 1.4; } .status b { color: var(--ink); }
#toast { position: fixed; left: 50%; bottom: 5.5rem; transform: translateX(-50%) translateY(20px); background: #1d2433; color: #fff; padding: .6rem 1.1rem; border-radius: 8px; opacity: 0; transition: .25s; z-index: 99; pointer-events: none; max-width: 90vw; text-align: center; }
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
@media (max-width: 640px) {
  .card { padding: 1rem; } .grid-2 { grid-template-columns: 1fr; } .intro li { grid-template-columns: 1fr; gap: 0; }
  .hero h1 { font-size: 1.4rem; } .status { flex-basis: 100%; } .actionbar .btn { flex: 1; padding-left: .6rem; padding-right: .6rem; } .actionbar .inner { gap: .5rem; }
}
</style>
</head>

<main class="container">
  <div class="hero">
    <h1 id="doc-title"></h1>
    <p id="doc-subtitle"></p>
  </div>

  <div class="alert">
    <b>입력한 내용은 서버로 전송되지 않습니다.</b> 이 브라우저 안에서 Word 파일(.docx)로 만들어져 바로 내려받아집니다.
    작성 중인 답변은 이 기기에 임시저장되므로 창을 닫았다가 다시 열어도 이어서 쓸 수 있습니다(연락처·계좌번호·주민등록번호는 저장하지 않습니다).
  </div>

  <section class="card">
    <dl class="meta" id="meta"></dl>
    <ul class="intro" id="intro"></ul>
  </section>

  <form id="form" autocomplete="off" novalidate>
    <section class="card">
      <h2>자문인 인적사항</h2>
      <div class="field">
        <label for="name">성명 <span class="req">*</span></label>
        <input type="text" id="name" name="name">
      </div>
      <div class="field">
        <label for="org">소속 회사 / 담당 업무 및 직급</label>
        <input type="text" id="org" name="org" placeholder="예: ○○일보 / 사회부 / 차장">
      </div>
      <div class="field">
        <span class="label">언론사 근무 연수 <small>(타사 근무 포함 총합)</small></span>
        <div class="career">
          <input type="number" id="years" name="years" min="0" max="60" inputmode="numeric" aria-label="근무 연수(년)"> 년
          <input type="number" id="months" name="months" min="0" max="11" inputmode="numeric" aria-label="근무 연수(개월)"> 개월
        </div>
      </div>
      <div class="field">
        <span class="label">후배 기자 지도 또는 데스킹 경험</span>
        <div class="options" data-check="desk"></div>
      </div>
      <div class="field">
        <span class="label">생성형 AI 사용 경험</span>
        <div class="options" data-check="aiuse"></div>
      </div>
      <div class="field">
        <span class="label">생성형 AI 사용 빈도</span>
        <div class="options" data-check="freq"></div>
      </div>
    </section>

    <div id="sections"></div>

    <p class="closing" id="closing"></p>

    <section class="card">
      <h2 id="receipt-title"></h2>
      <div class="receipt-head">
        <div class="amount" id="receipt-amount"></div>
        <div id="receipt-purpose"></div>
      </div>
      <div class="grid-2">
        <div class="field">
          <label for="r_name">영수인 <small>(성명을 따라 채워집니다)</small></label>
          <input type="text" id="r_name" name="r_name">
        </div>
        <div class="field">
          <label for="r_org">소속</label>
          <input type="text" id="r_org" name="r_org">
        </div>
        <div class="field">
          <label for="r_tel">연락처</label>
          <input type="tel" id="r_tel" name="r_tel" placeholder="010-0000-0000">
        </div>
        <div class="field">
          <label for="r_bank">은행 / 계좌번호</label>
          <input type="text" id="r_bank" name="r_bank" placeholder="예: ○○은행 000-00-000000">
        </div>
        <div class="field">
          <label for="r_rrn">주민등록번호</label>
          <input type="text" id="r_rrn" name="r_rrn" inputmode="numeric" placeholder="000000-0000000" maxlength="14">
        </div>
        <div class="field">
          <label for="date">작성일</label>
          <input type="date" id="date" name="date">
        </div>
      </div>
      <p class="receipt-to" id="receipt-to"></p>
      <p class="note" id="receipt-note" style="margin:0"></p>
    </section>
  </form>

  <div class="alert ok" id="done" hidden></div>
</main>

<div class="actionbar">
  <div class="inner">
    <div class="status"><span id="progress"></span><br><span id="saved"></span></div>
    <button type="button" class="btn" id="btn-clear">입력 내용 지우기</button>
    <button type="button" class="btn btn-primary" id="btn-download">Word 파일 내려받기</button>
  </div>

을 말씀해 주십시오. 이러한 기준을 어떤 방식으로 배우셨는지 구체적으로 설명해 주십시오."]}, {"type": "q", "key": "a7", "title": "7. 생성형 AI의 활용이 기자로서 필요한 지식과 기술을 배우는 방식에 변화를 가져왔다고 느끼십니까?", "guide": ["과거에는 선배나 동료에게 물어보던 문제를 AI를 통해 해결하거나, 반대로 AI로 얻은 정보를 선배와 함께 검토한 경험이 있습니까? AI의 활용이 새로운 지식을 습득하거나 업무 능력을 발전시키는 데 어떤 도움이 되었거나 어려움을 주었는지 설명해 주십시오."]}, {"type": "q", "key": "a8", "title": "8. 생성형 AI의 활용 이후 선후배 기자 사이의 기사 수정이나 데스킹 과정에 변화가 있었습니까?", "guide": ["기사의 사실관계와 취재 근거를 확인하고 수정하는 과정에서 주고받는 질문이나 피드백이 어떻게 이루어지고 있는지 설명해 주십시오. 특히 어떤 사실을 확인해야 하는지, 어느 정도까지 검증해야 하는지 등을 배우거나 지도하는 방식에 변화가 있었습니까? 변화가 없거나 오히려 지도와 학습에 도움이 되었다고 느낀 사례도 말씀해 주십시오."]}, {"type": "q", "key": "a9", "title": "9. 생성형 AI를 통해 배우는 것과 선배 기자나 동료의 경험을 통해 배우는 것에는 어떤 차이가 있다고 생각하십니까?", "guide": ["기자로서 필요한 지식과 기술 가운데 AI를 통해 효과적으로 배울 수 있는 것은 무엇이며, 선배의 지도나 실제 취재 경험을 통해 배워야 한다고 생각하는 것은 무엇입니까? AI 활용이 선후배 사이의 지식과 경험 전수에 어떤 영향을 미치고 있다고 생각하십니까?"]}]}, {"title": "Ⅲ. 전문직 가치와 기자의 판단 기준", "items": [{"type": "q", "key": "a10", "title": "10. 생성형 AI를 취재나 기사 작성에 활용할 때 언론의 전문적 가치와 규범을 어떻게 고려하고 계십니까?", "guide": ["예를 들어 정확성, 공정성, 객관성, 언론의 자유, 사회적 책임 등의 기준을 AI 활용 과정에서 어떻게 적용하고 계십니까? AI가 제공한 결과가 이러한 기준에 부합하는지 판단하기 어려웠거나 직접 수정한 경험이 있다면 말씀해 주십시오."]}, {"type": "q", "key": "a11", "title": "11. 소속 언론사나 언론 관련 단체에서 제시한 생성형 AI 활용 가이드라인을 알고 계십니까?", "guide": ["관련 가이드라인이나 교육을 접한 경험이 있다면 설명해 주십시오. 실제 업무에서 이를 참고하거나 적용한 경험이 있습니까? 가이드라인이 도움이 된 부분이나 실제 취재 및 기사 작성 과정에 적용하기 어려웠던 부분이 있다면 말씀해 주십시오. 앞으로 어떤 기준이나 교육이 추가로 필요하다고 생각하십니까?"]}, {"type": "q", "key": "a12", "title": "12. 전문성을 갖춘 좋은 기자가 되기 위해 가장 중요하다고 생각하는 능력이나 자질은 무엇입니까?", "guide": ["이러한 역량은 생성형 AI가 발전하더라도 여전히 중요하다고 생각하십니까? AI의 활용이 기자의 전문성을 강화하거나 약화한다고 느낀 경험이 있다면 구체적으로 설명해 주십시오."]}]}, {"title": "Ⅳ. 기자의 직업적 정체성과 미래", "items": [{"type": "q", "key": "a13", "title": "13. 앞으로 10년 후 기자라는 직업은 어떻게 변화할 것이라고 생각하십니까?", "guide": ["생성형 AI가 기자의 업무를 상당 부분 대체할 것이라고 생각하십니까? 사라지거나 축소될 가능성이 있는 업무와 인간 기자가 계속 담당해야 할 업무는 무엇이라고 보십니까? 그렇게 생각하시는 이유를 설명해 주십시오."]}, {"type": "q", "key": "a14", "title": "14. 생성형 AI 시대에 기자라는 직업이 지속적으로 가치를 인정받기 위해서는 무엇이 필요하다고 생각하십니까?", "guide": ["앞으로 기자에게 특히 중요해질 전문성과 역량은 무엇이며, 이를 갖추기 위해 기자 개인과 언론사가 어떻게 변화해야 한다고 생각하십니까? 기자 교육이나 후배 양성 방식에서 달라져야 할 부분이 있다면 말씀해 주십시오."]}]}, {"title": "Ⅴ. 경력에 따른 추가 질문", "items": [{"type": "note", "text": "※ 해당하는 경력 구간의 문항에만 답변해 주십시오."}, {"type": "sub", "text": "1) 고연차 기자 대상 (경력 10년 이상)"}, {"type": "q", "key": "a15", "title": "1-1. 과거 후배 기자를 지도하거나 데스킹했던 경험과 비교할 때, 생성형 AI 도입 이후 후배 기자의 학습 방식이나 자신의 지도 방식에 변화가 있었습니까?", "guide": ["후배의 취재 자료나 기사 초안을 확인하고, 사실관계와 취재 근거를 질문하거나 수정 사항을 설명하는 과정에서 달라진 점이 있다면 구체적인 사례를 말씀해 주십시오. 본인이 AI를 활용하면서 지도 방식이 달라진 경험도 포함해 주십시오."]}, {"type": "q", "key": "a16", "title": "1-2. 생성형 AI를 활용하는 후배 기자들의 업무 수행 능력이나 전문적 판단에 관하여 어떤 경험을 하셨습니까?", "guide": ["후배 기자들이 AI를 통해 이전보다 쉽게 배우거나 업무를 수행한다고 느낀 사례가 있습니까? 반대로 선배의 지도나 현장 경험을 통해 배워야 할 능력이 충분히 형성되지 않는다고 느낀 사례가 있다면 말씀해 주십시오. 후배 기자에게 AI 활용 방법을 배우거나 자신의 전문성과 역할을 새롭게 생각하게 된 경험이 있다면 설명해 주십시오."]}, {"type": "sub", "text": "2) 저연차 기자 대상 (경력 5년 미만)"}, {"type": "q", "key": "a17", "title": "2-1. 취재나 기사 작성 과정에서 모르는 내용이 있거나 판단하기 어려운 상황에 놓였을 때, 생성형 AI와 선배 기자 또는 동료 가운데 누구에게 도움을 요청하십니까?", "guide": ["상황에 따라 도움을 요청하는 대상이 달라진다면 그 이유를 설명해 주십시오. AI의 답변과 선배의 조언이 달랐거나 한쪽의 설명이 더 도움이 되었던 구체적인 경험이 있다면 말씀해 주십시오."]}, {"type": "q", "key": "a18", "title": "2-2. 선배 기자의 지도나 데스킹을 통해 배우는 것과 생성형 AI의 설명이나 수정 결과를 통해 배우는 것을 비교하면 어떤 차이가 있습니까?", "guide": ["AI를 활용하면서 독자적으로 문제를 해결하거나 학습한 경험이 있습니까? 반대로 선배의 지도를 받거나 직접 취재하는 과정에서만 배울 수 있다고 느꼈던 경험이 있다면 설명해 주십시오."]}]}, {"title": "Ⅵ. 기타 의견", "items": [{"type": "q", "key": "a19", "title": "", "guide": ["기타 남기고 싶은 의견이 있으시다면 아래에 자유롭게 써 주십시오. 연구에 큰 도움이 되리라 생각합니다."]}]}], "closing": "응답해 주셔서 진심으로 감사드립니다.", "receipt": {"title": "영 수 증", "amount": "금 액 : 150,000원", "purpose": ["고려대학교 미디어대학원 연구용역", "(언론의 인공지능 활용에 대한 연구) 전문가 인터뷰비로 정히 영수함."], "to": "한국언론학회 귀중"}, "receiptNote": "※ 수집한 개인정보는 자문비 지급 목적으로만 사용되며, 지급 완료 후 즉시 삭제됩니다.", "checks": [{"key": "desk", "options": ["있음", "없음"]}, {"key": "aiuse", "options": ["현재 사용", "과거 사용했으나 현재 사용하지 않음", "사용 경험 없음"]}, {"key": "freq", "options": ["거의 매일", "주 2~3회", "주 1회 이하", "거의 사용하지 않음", <!-- 문서 생성부: 화면과 무관한 순수 함수만 둔다(Node 에서도 그대로 시험할 수 있다). -->
<script id="gen">
"use strict";
const DOCX_MIME = "application/vnd.openxmlformats-officedocument.wordprocessingml.document";

function cleanText(s) {
  return String(s == null ? "" : s)
    .replace(/\r\n?/g, "\n").replace(/\t/g, "    ")
    .replace(/[^\n\x20-퟿-�\u{10000}-\u{10FFFF}]/gu, "")
    .replace(/^\n+/, "").replace(/\s+$/, "");
}
function xmlEsc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

/** 서식 document.xml 의 {{이름}} 자리에 값을 채운다. */
function fillDocument(data, v) {
  const tpl = data.doc;
  const checked = [];
  for (const c of data.checks)
    c.options.forEach((_, i) => checked.push(v[c.key] === i));

  return tpl.replace(/\{\{(\w+)\}\}/g, (m, key, pos) => {
    if (/^cb\d+$/.test(key)) return checked[+key.slice(2)] ? "■" : "☐";
    if (key === "career") {
      const y = cleanText(v.years), mo = cleanText(v.months);
      if (!y && !mo) return data.blanks.career;
      return xmlEsc(`${y || 0}년 ${mo || 0}개월`);
    }
    if (key === "date") {
      const d = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v.date || "");
      if (!d) return data.blanks.date;
      return `${d[1]}.  ${+d[2]}.  ${+d[3]}.`;
    }
    const text = cleanText(v[key]);
    if (!text) return "";
    const lines = text.split("\n");
    if (lines.length === 1 || !/^a\d+$/.test(key)) return xmlEsc(lines.join(" "));
    // 여러 줄 답변: 빈칸이 들어 있던 문단의 서식을 그대로 복제해 줄마다 한 문단씩 만든다.
    const head = tpl.slice(tpl.lastIndexOf("<w:p>", pos), pos);
    return lines.map(xmlEsc).join("</w:t></w:r></w:p>" + head);
  });
}

const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(u8) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < u8.length; i++) c = CRC_TABLE[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
async function deflateRaw(u8) {
  if (typeof CompressionStream === "undefined") return null;
  try {
    const stream = new Blob([u8]).stream().pipeThrough(new CompressionStream("deflate-raw"));
    return new Uint8Array(await new Response(stream).arrayBuffer());
  } catch (e) { return null; }
}

/** files: [{name, data: Uint8Array}] → ZIP(Blob). 압축을 못 쓰는 브라우저에서는 무압축으로 담는다. */
async function makeZip(files, mime) {
  const enc = new TextEncoder(), local = [], central = [];
  const now = new Date();
  const time = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1);
  const date = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
  let offset = 0;
  for (const f of files) {
    const name = enc.encode(f.name), crc = crc32(f.data);
    let body = await deflateRaw(f.data), method = 8;
    if (!body || body.length >= f.data.length) { body = f.data; method = 0; }

    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(8, method, true);
    lh.setUint16(10, time, true); lh.setUint16(12, date, true); lh.setUint32(14, crc, true);
    lh.setUint32(18, body.length, true); lh.setUint32(22, f.data.length, true); lh.setUint16(26, name.length, true);
    local.push(new Uint8Array(lh.buffer), name, body);

    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(10, method, true);
    ch.setUint16(12, time, true); ch.setUint16(14, date, true); ch.setUint32(16, crc, true);
    ch.setUint32(20, body.length, true); ch.setUint32(24, f.data.length, true); ch.setUint16(28, name.length, true);
    ch.setUint32(42, offset, true);
    central.push(new Uint8Array(ch.buffer), name);
    offset += 30 + name.length + body.length;
  }
  const cdSize = central.reduce((n, c) => n + c.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
  return new Blob([...local, ...central, new Uint8Array(end.buffer)], { type: mime });
}

function b64ToBytes(b64) {
  const bin = atob(b64), out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

/** 입력값 v 를 서식에 채운 docx 를 Blob 으로 돌려준다. */
async function buildDocx(data, v) {
  const enc = new TextEncoder(), files = [];
  for (const p of data.parts) {
    files.push({ name: p.n, data: p.t != null ? enc.encode(p.t) : b64ToBytes(p.b) });
    if (p.n === "_rels/.rels") files.push({ name: "word/document.xml", data: enc.encode(fillDocument(data, v)) });
  }
  return makeZip(files, DOCX_MIME);
}
function docxFileName(data, v) {
  const name = cleanText(v.name).replace(/[\\/:*?"<>|\s]+/g, "");
  return `${data.fileBase}${name ? "_" + name : ""}.docx`;
}
</script>

<script>
"use strict";
(() => {
  const DATA = JSON.parse(document.getElementById("form-data").textContent);
  const DRAFT_KEY = "advisory-form-draft-v1";
  const NOT_SAVED = ["r_tel", "r_bank", "r_rrn"];   // 민감 정보는 기기에 남기지 않는다
  const $ = (id) => document.getElementById(id);
  const form = $("form");
  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  };

  // ── 화면 구성 ────────────────────────────────────────────────
  $("bar-title").textContent = DATA.title;
  $("doc-title").textContent = DATA.title;
  $("doc-subtitle").textContent = DATA.subtitle;
  for (const [k, val] of DATA.meta) { $("meta").append(el("dt", "", k), el("dd", "", val)); }
  for (const [label, text] of DATA.intro) {
    const li = el("li", label ? "" : "plain");
    if (label) li.append(el("b", "", label), el("span", "", text)); else li.textContent = text;
    $("intro").append(li);
  }
  for (const c of DATA.checks) {
    const box = document.querySelector(`[data-check="${c.key}"]`);
    c.options.forEach((opt, i) => {
      const lab = el("label"), inp = el("input");
      inp.type = "radio"; inp.name = c.key; inp.value = String(i);
      lab.append(inp, document.createTextNode(opt));
      box.append(lab);
    });
  }
  const answerKeys = [];
  for (const s of DATA.sections) {
    const card = el("section", "card");
    card.append(el("h2", "", s.title));
    for (const it of s.items) {
      if (it.type === "sub") card.append(el("div", "sub", it.text));
      else if (it.type === "note") card.append(el("p", "note", it.text));
      else {
        const q = el("div", "q"), ta = el("textarea"), count = el("div", "count");
        ta.id = ta.name = it.key; ta.rows = 6;
        ta.setAttribute("aria-label", it.title || s.title);
        if (it.title) q.append(el("h3", "", it.title));
        for (const g of it.guide) q.append(el("p", "guide", g));
        q.append(ta, count);
        card.append(q);
        answerKeys.push(it.key);
      }
    }
    $("sections").append(card);
  }
  $("closing").textContent = DATA.closing;
  $("receipt-title").textContent = DATA.receipt.title;
  $("receipt-amount").textContent = DATA.receipt.amount;
  for (const line of DATA.receipt.purpose) $("receipt-purpose").append(el("p", "", line));
  $("receipt-to").textContent = DATA.receipt.to;
  $("receipt-note").textContent = DATA.receiptNote;

  // ── 값 읽기·쓰기 ─────────────────────────────────────────────
  const textKeys = ["name", "org", "years", "months", ...answerKeys, "r_name", "r_org", "r_tel", "r_bank", "r_rrn", "date"];
  function readValues() {
    const v = {};
    for (const k of textKeys) v[k] = form.elements[k].value;
    for (const c of DATA.checks) {
      const picked = form.querySelector(`input[name="${c.key}"]:checked`);
      v[c.key] = picked ? +picked.value : null;
    }
    return v;
  }
  function writeValues(v) {
    for (const k of textKeys) if (v[k] != null) form.elements[k].value = v[k];
    for (const c of DATA.checks) {
      const inp = v[c.key] == null ? null : form.querySelector(`input[name="${c.key}"][value="${v[c.key]}"]`);
      if (inp) inp.checked = true;
    }
  }
  function today() {
    const d = new Date(), p = (n) => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
  }
  function toast(msg) {
    const t = $("toast");
    t.textContent = msg; t.classList.add("show");
    clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove("show"), 2600);
  }

  // ── 임시저장 ────────────────────────────────────────────────
  let receiptNameEdited = false;
  function saveDraft() {
    const v = readValues();
    for (const k of NOT_SAVED) delete v[k];
    v._receiptNameEdited = receiptNameEdited;
    try {
      localStorage.setItem(DRAFT_KEY, JSON.stringify(v));
      const d = new Date();
      $("saved").textContent = `임시저장 ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
    } catch (e) { $("saved").textContent = "이 브라우저에서는 임시저장을 쓸 수 없습니다"; }
  }
  function loadDraft() {
    try {
      const v = JSON.parse(localStorage.getItem(DRAFT_KEY) || "null");
      if (!v) return false;
      receiptNameEdited = !!v._receiptNameEdited;
      writeValues(v);
      return true;
    } catch (e) { return false; }
  }

  function refresh() {
    let done = 0;
    for (const k of answerKeys) {
      const ta = form.elements[k], n = ta.value.trim().length;
      if (n) done++;
      ta.nextElementSibling.textContent = n ? `${n.toLocaleString()}자` : "";
    }
    $("progress").innerHTML = `답변 작성 <b>${done}</b> / ${answerKeys.length}`;
  }
  function grow(ta) {
    ta.style.height = "auto";
    ta.style.height = ta.scrollHeight + 2 + "px";
  }

  let saveTimer = 0;
  form.addEventListener("input", (e) => {
    const t = e.target;
    if (t.id === "r_name") receiptNameEdited = t.value !== "";
    if (t.id === "name") { t.classList.remove("bad"); if (!receiptNameEdited) $("r_name").value = t.value; }
    if (t.id === "r_rrn") {
      const digits = t.value.replace(/\D/g, "").slice(0, 13);
      t.value = digits.length > 6 ? digits.slice(0, 6) + "-" + digits.slice(6) : digits;
    }
    if (t.tagName === "TEXTAREA") grow(t);
    refresh();
    clearTimeout(saveTimer); saveTimer = setTimeout(saveDraft, 500);
  });
  form.addEventListener("change", () => { clearTimeout(saveTimer); saveTimer = setTimeout(saveDraft, 200); });
  form.addEventListener("submit", (e) => e.preventDefault());

  $("btn-clear").addEventListener("click", () => {
    if (!confirm("입력한 내용을 모두 지울까요? 임시저장된 내용도 함께 지워집니다.")) return;
    form.reset();
    receiptNameEdited = false;
    try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
    $("date").value = today();
    $("saved").textContent = ""; $("done").hidden = true;
    form.querySelectorAll("textarea").forEach(grow);
    refresh();
    window.scrollTo({ top: 0 });
  });

  $("btn-download").addEventListener("click", async () => {
    const v = readValues();
    if (!v.name.trim()) {
      $("name").classList.add("bad"); $("name").focus();
      toast("성명을 입력해 주십시오.");
      return;
    }
    const btn = $("btn-download");
    btn.disabled = true;
    try {
      const blob = await buildDocx(DATA, v), fname = docxFileName(DATA, v);
      const url = URL.createObjectURL(blob), a = el("a");
      a.href = url; a.download = fname;
      document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 15000);
      saveDraft();
      const blank = answerKeys.filter((k) => !v[k].trim()).length;
      const box = $("done");
      box.textContent = "";
      box.append(el("b", "", `파일을 내려받았습니다: ${fname}`), el("br"),
        document.createTextNode(blank
          ? `아직 비어 있는 답변란이 ${blank}개 있습니다. 해당하지 않는 문항이면 그대로 두셔도 됩니다. 내용을 고친 뒤 다시 내려받을 수 있습니다.`
          : "내려받은 파일을 연구자에게 보내 주십시오. 내용을 고친 뒤 다시 내려받을 수도 있습니다."));
      box.hidden = false;
      toast("Word 파일을 내려받았습니다.");
    } catch (e) {
      console.error(e);
      toast("파일을 만들지 못했습니다. 다른 브라우저(Chrome, Edge)에서 다시 시도해 주십시오.");
    } finally { btn.disabled = false; }
  });

  // ── 시작 ───────────────────────────────────────────────────
  const restored = loadDraft();
  if (!$("date").value) $("date").value = today();
  form.querySelectorAll("textarea").forEach(grow);
  refresh();
  if (restored) $("saved").textContent = "임시저장된 내용을 불러왔습니다";
})();
</script>
</body>
</html>
